name: Apply DeepSeek title refine

on:
  push:
    branches:
      - redesign/website-v1
    paths:
      - '.github/workflows/apply-title-refine.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/website-v1
          fetch-depth: 0
      - name: Add title refinement stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('blog/deepseek-harness/index.html')
          s=p.read_text()
          href='https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@cb6a11dfc194cc97a9ff86f2d08febd4a8688cb6/blog/title-refine-v2.css'
          tag=f'<link rel="stylesheet" href="{href}" />'
          if tag not in s:
              s=s.replace('</head>', tag+'\n</head>')
              p.write_text(s)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/deepseek-harness/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "apply refined DeepSeek article title"
          git push origin HEAD:redesign/website-v1
