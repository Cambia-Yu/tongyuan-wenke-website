name: Build Hero Video Asset

on:
  push:
    branches:
      - redesign/website-v1
    paths:
      - 'assets/hero-video-base64/**'
      - '.github/workflows/build-hero-video.yml'

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/website-v1
          fetch-depth: 0
      - name: Reconstruct MP4
        shell: bash
        run: |
          mkdir -p assets
          cat assets/hero-video-base64/part-* > /tmp/hero-video.b64
          base64 --decode /tmp/hero-video.b64 > assets/hero-cave-1080.mp4
          test -s assets/hero-cave-1080.mp4
      - name: Commit binary asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-cave-1080.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build hero cave video asset"
          git push origin HEAD:redesign/website-v1
