<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="twk-home-version" content="v8.13-serif700">
<meta name="theme-color" content="#05070a">
<title>通元问科</title>
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@b8d1160580158e45d29ed1be72e4661b1ba802ba/homepage-v8/home.css">
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@e2024f37acca940401d9c504dd5d765d98d06b5e/shared/typography-v1.css">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@80afafe2733e4e9d3704766be226d41bb42ef212/homepage-v8/hero-v3.9.6.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@2355ca880dd0412d41d31ad5de7b2be07f5fa14b/homepage-v8/home.js">
<style>
html,body{margin:0;background:#05070a}
body[data-twk-shell="1"]{min-height:500vh;overflow-y:auto}
#twk-shell{position:fixed;inset:0;background:#05070a;pointer-events:none}
</style>
</head>
<body data-twk-shell="1">
<div id="twk-shell" aria-hidden="true"></div>
<script>
(async()=>{
  try{
    const params=new URLSearchParams(location.search);
    const domain=params.get('domain');
    const caseId=params.get('case');
    const page=params.get('page');
    const article=params.get('article');
    const rawBase='https://raw.githubusercontent.com/Cambia-Yu/tongyuan-wenke-website/redesign/website-v1/';
    const typeCss='https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@e2024f37acca940401d9c504dd5d765d98d06b5e/shared/typography-v1.css';
    const blogRefineCss='https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@7c31e23d86e929de317b14a53772bae21fa8750f/blog/article-refine-v1.css';
    const blogTocJs='https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@aafb43cfdff13cd05551b168ffc30e07960c34a2/blog/article-toc-v1.js';
    const supplyRefineCss='https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@08b882c092ba7f4fd8157e3e51b2bcd8ee5e4c98/domains/supply-chain/refine-v1.css';

    // Keep the temporary document tall so wheel/trackpad input becomes real
    // scroll position while the remote page source is arriving. Do not touch
    // video.currentTime here; the canonical scrubber owns media seeking.
    const fetchRemote=async path=>{
      const r=await fetch(rawBase+path,{cache:'default'});
      if(!r.ok) throw new Error('page source '+r.status);
      return r.text();
    };
    const addStyle=(html,href)=>html.replace('</head>',`<link rel="stylesheet" href="${href}"></head>`);
    const decorateRemote=(path,source)=>{
      let html=addStyle(source,typeCss);
      if(path==='domains/supply-chain/index.html')html=addStyle(html,supplyRefineCss);
      if(path==='blog/deepseek-harness/index.html'){
        html=addStyle(html,blogRefineCss);
        html=html.replace('</body>',`<script src="${blogTocJs}"></`+`script></body>`);
      }
      return html;
    };
    const writeRemote=async path=>{
      const html=decorateRemote(path,await fetchRemote(path));
      document.open();document.write(html);document.close();
    };

    if(domain==='supply-chain'){await writeRemote('domains/supply-chain/index.html');return;}
    if(caseId==='supply-chain-research'){await writeRemote('cases/supply-chain-research/index.html');return;}
    if(caseId==='settlement-exception'){await writeRemote('cases/settlement-exception/index.html');return;}
    if(page==='blog'){await writeRemote('blog/index.html');return;}
    if(article==='deepseek-harness'){await writeRemote('blog/deepseek-harness/index.html');return;}

    let html=await fetchRemote('homepage-v3/index.html');
    html=html.replace('https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@01b56b2a9fae7cfcdc89c9d2ee468c71300340b8/homepage-v3/home-v1.css','data:text/css,');
    html=html.replace('https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@229a2a3a6f8b07d6318bd025b7270489ad371e38/homepage-v3/home-v2-texture.css','data:text/css,');

    const closeScript='<'+ '/script>';
    const preboot='<script>'+`(()=>{window.__twkStopHeroPreboot=()=>{delete window.__twkStopHeroPreboot}})();`+closeScript;
    const oldHero='<script src="https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@96a5ce8d5577b6242f668e6c2f6e29515d9ae988/frozen/hero-v3.9.3.js">'+closeScript;
    const newHero=preboot+'<script src="https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@80afafe2733e4e9d3704766be226d41bb42ef212/homepage-v8/hero-v3.9.6.js">'+closeScript;
    html=html.replace(oldHero,newHero);
    html=html.replace('</head>',`<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@b8d1160580158e45d29ed1be72e4661b1ba802ba/homepage-v8/home.css"><link rel="stylesheet" href="${typeCss}"></head>`);
    html=html.replace('https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@5fa4aabb656a7f73a8901a8ec1404f95e5c29640/homepage-v3/home-v1.js','https://cdn.jsdelivr.net/gh/Cambia-Yu/tongyuan-wenke-website@2355ca880dd0412d41d31ad5de7b2be07f5fa14b/homepage-v8/home.js');
    html=html.replace('<body>','<body id="top" data-home-version="v8.13-serif700">');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div style="font:14px system-ui;padding:32px;color:#d9e0ec;background:#05070a;min-height:100vh">Page preview load failed.</div>';
  }
})();
</script>
</body>
</html>
