<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通元问科</title></head>
<body>
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/Cambia-Yu/tongyuan-wenke-website/redesign/website-v1/homepage-v3/index.html?v='+Date.now();
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('source '+response.status);
    const html=await response.text();
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div style="font:14px system-ui;padding:32px;color:#0d1830">Homepage preview load failed.</div>';
  }
})();
</script>
</body>
</html>
